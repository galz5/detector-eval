[project]
name = "detector-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.11.1",
    "scikit-learn==1.6.1",
]

[tool.pyright]
extraPaths = ["starter"]

[tool.pytest.ini_options]
pythonpath = [".", "starter"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
